name: Validate Nike dropdown changes
on:
  push:
    branches: [feature/shared-nike-select]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vite application
        run: npm run build
      - name: Run storefront, checkout and admin tests
        run: npm run test:storefront
